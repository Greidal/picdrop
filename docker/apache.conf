# Loaded as conf-enabled/zz-picdrop.conf so it overrides Debian's security.conf.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    # Event UUIDs travel in URLs; don't leak them to third parties.
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=()"
</IfModule>

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Internal includes and CLI scripts are never served directly.
<Directory /var/www/html/lib>
    Require all denied
</Directory>

# Uploaded files are data only: never execute scripts from here.
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    RemoveHandler .php .phtml .phar
    RemoveType .php .phtml .phar
    <FilesMatch "(?i)\.(php\d?|phtml|phar|pht|shtml|cgi|pl|py|htaccess)$">
        Require all denied
    </FilesMatch>
    Header set X-Content-Type-Options "nosniff"
    Header set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox"
    # File names are unique, so uploads can be cached forever.
    Header set Cache-Control "private, max-age=31536000, immutable"
</Directory>

# Temporary files (ZIP exports) are never served.
<Directory /var/www/html/uploads/.tmp>
    Require all denied
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

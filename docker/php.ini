; Loaded after php.ini-production.
expose_php = Off

; Hardening: the app needs neither shell access nor remote file access.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl
allow_url_fopen = Off
allow_url_include = Off
open_basedir = /var/www:/tmp

file_uploads = On
upload_max_filesize = 100M
post_max_size = 100M
; Decoding large phone photos for thumbnails needs a fair amount of memory.
memory_limit = 512M
max_execution_time = 600

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000

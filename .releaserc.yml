branches:
  - main
  - master
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        # Pre-1.0: breaking changes (e.g. required deployment changes, documented
        # via a "BREAKING CHANGE:" footer) bump the minor version, not the major.
        # Remove this rule when going 1.0.
        - breaking: true
          release: minor
        - type: FEAT
          release: minor
        - type: FIX
          release: patch
        - type: REFAC
          release: patch
        - type: feat
          release: minor
        - type: fix
          release: patch

  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        # First matching entry wins, so scoped entries come before the generic ones.
        types:
          - type: feat
            section: Features
          - type: FEAT
            section: Features
          - type: fix
            scope: deps
            section: Dependencies
          - type: chore
            scope: deps
            section: Dependencies
          - type: fix
            section: Bug Fixes
          - type: FIX
            section: Bug Fixes
          - type: perf
            section: Performance
          - type: revert
            section: Reverts
          - type: refactor
            section: Code Refactoring
          - type: REFAC
            section: Code Refactoring
          - type: docs
            hidden: true
          - type: test
            hidden: true
          - type: ci
            hidden: true
          - type: build
            hidden: true
          - type: style
            hidden: true
          - type: chore
            hidden: true

  - "@semantic-release/changelog"

  - - "@semantic-release/git"
    - assets:
      - CHANGELOG.md
      message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"

  - "@semantic-release/github"

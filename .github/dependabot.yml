version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      # fix: -> semantic-release publishes a patch release with the updated dependency
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Database upgrades beyond patch releases are done deliberately, LTS to LTS (see README).
      - dependency-name: mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: test
      include: scope
    groups:
      e2e:
        patterns: ["*"]
